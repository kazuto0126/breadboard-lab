name: Deploy to GitHub Pages

# main 每次更新就把網站版（含離線版 HTML）部署到 GitHub Pages。
# 第一次使用前要在 GitHub 打開：Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 建置網站
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 離線版也放在網站上，學生可以直接下載一個檔案帶走。
      - run: npm run build:single && cp dist-single/breadboard-lab.html dist/breadboard-lab-offline.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
